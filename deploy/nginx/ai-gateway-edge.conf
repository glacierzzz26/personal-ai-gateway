# =====================================================================
# ai-gateway-edge.conf — 域名边缘反代(Nginx,宿主原生,非容器)。
#
# 由 deploy/scripts/setup-edge.sh 渲染:替换 __DOMAIN__ / __*_UPSTREAM__ /
# __*_CERT__ / __*_KEY__ 后落到 /etc/nginx/conf.d/ 并 reload。
#
# 端口分工(宿主网络):
#   443   仅域名(公信证书) → 管理台/登录面(回源 127.0.0.1:17090)
#   17080 同端口双证书:SNI=域名 → 公信证书 → 数据面(回源 127.0.0.1:17080)
#                       无 SNI(裸 IP) → default_server 自签证书 → 同一数据面
#   17090 不改:Nginx 不碰,网关自行发布,旧 IP:17090 入口原样可用
#
# 为什么切到域名后「旧 IP:17080 客户端不断」:裸 IP 握手不发 SNI,Nginx 落到
# default_server 块,用含 IP SAN 的自签证书回退 —— 旧客户端(已导入 CA)照常验真;
# 域名客户端带 SNI=__DOMAIN__,拿到公信证书,无需再导 CA。
#
# 回源为何仍用 https:网关自签 TLS 同时承担「两面物理隔离」(HandlerAPI 仅 /v1/*,
# HandlerAdmin 仅 /api/v1/*+SPA);明文 :8787 是合并面,绝不发布,故回源走 https。
# =====================================================================

# ==================== 443:管理台 / 登录面(公信证书) ====================

# 裸 IP 打 443:直接断开,避免无 SNI 时落到公信证书块(既不匹配域名,也无意义)。
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     __PUBLIC_CERT__;
    ssl_certificate_key __PUBLIC_KEY__;
    return 444;
}

server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     __PUBLIC_CERT__;
    ssl_certificate_key __PUBLIC_KEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass          __ADMIN_UPSTREAM__;   # https://127.0.0.1:17090
        proxy_ssl_verify    off;                  # 回源自签证书
        proxy_http_version  1.1;
        # 用 $http_host(含端口),让网关按请求推断的对外基址与浏览器所见一致。
        proxy_set_header Host              $http_host;
        # 必须覆写:网关无条件信任 X-Forwarded-Proto 决定 Secure Cookie 与基址推断,
        # 不可把客户端送来的值透传过去。
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}

# ==================== 17080:数据面(SNI 双证书) ====================

# 无 SNI(裸 IP:17080)→ 自签回退,服务旧客户端(已导 CA)。
server {
    listen 17080 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     __SELF_CERT__;
    ssl_certificate_key __SELF_KEY__;

    location / {
        proxy_pass          __API_UPSTREAM__;     # https://127.0.0.1:17080
        proxy_ssl_verify    off;
        proxy_http_version  1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 流式(SSE)关键:关缓冲,否则首字节被 Nginx 攒住。对应旧 Caddy 的 flush_interval -1。
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}

# SNI=__DOMAIN__ → 公信证书,新客户端用它,不再需要导 CA。
server {
    listen 17080 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     __PUBLIC_CERT__;
    ssl_certificate_key __PUBLIC_KEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass          __API_UPSTREAM__;
        proxy_ssl_verify    off;
        proxy_http_version  1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
