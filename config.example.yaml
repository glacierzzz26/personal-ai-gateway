# personal-ai-gateway 配置示例。密钥一律用 ${ENV} 引用,不要写死进仓库。
listen: ":8787"
db_path: "gateway.db"

# 统一 API keys:你所有工具(client)用的同一把钥匙写在这里。
# secret 用强随机串:openssl rand -hex 24
keys:
  - name: laptop-coder
    secret: ${GATEWAY_KEY_LAPTOP}
    note: Claude Code / OpenCode 共用
  - name: scripts
    secret: ${GATEWAY_KEY_SCRIPTS}
    note: 自写脚本/定时任务

# 订阅源(上游)不配置在 config.yaml:运行期以 gateway.db 的 upstreams 表为唯一权威,
# 一律经管理 API 维护 —— GET/POST/PUT/DELETE /api/v1/upstreams(curl 示例见 README,
# Web 管理台也可操作)。一条上游的字段(name/type/base_url/api_key/priority/models/
# cooldown_sec/max_failures/quota,type 决定出站协议)即该 API 的 JSON body;
# api_key 可写字面值或 ${ENV} 引用。全新部署(空 DB)启动即空上游:模型请求将 404,
# 先加一条源即可用。

# 成本单价表(USD / 每百万 token),按声明顺序匹配,命中第一条即停,支持 "*" 与前缀通配。
# 规则匹配到就按 (prompt*pm + completion*cm + cache_read*crm) / 1e6 折算每次请求的成本入库。
# 单价不对会把"用量"记账算错,但对查询本身无影响;没有匹配规则的模型 cost 记 0。
# 下列数值仅示意,请按各模型在官方的真实单价填写。
pricing:
  - model: claude-opus-*
    prompt_per_m: 15
    completion_per_m: 75
    cache_read_per_m: 1.5
  - model: claude-sonnet-*
    prompt_per_m: 3
    completion_per_m: 15
    cache_read_per_m: 0.3
  - model: claude-haiku-*
    prompt_per_m: 1
    completion_per_m: 5
    cache_read_per_m: 0.1
  - model: "*"            # 兜底:未收录模型记 0(可留空或删除本行)
    prompt_per_m: 0
    completion_per_m: 0
    cache_read_per_m: 0
