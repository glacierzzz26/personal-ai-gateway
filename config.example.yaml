# personal-ai-gateway 配置示例。密钥一律用 ${ENV} 引用,不要写死进仓库。
listen: ":8787"
db_path: "gateway.db"

# 统一 API keys:你所有工具(client)用的同一把钥匙写在这里。
# secret 用强随机串:openssl rand -hex 24
keys:
  - name: laptop-coder
    secret: ${GATEWAY_KEY_LAPTOP}
    note: Claude Code / OpenCode 共用
  - name: scripts
    secret: ${GATEWAY_KEY_SCRIPTS}
    note: 自写脚本/定时任务

# 上游:每家厂商/中转一份。type 决定出站协议与路径拼接规则:
#   type: openai     → base_url 需含 /v1,出站拼 /chat/completions
#   type: anthropic  → base_url 为域名根,出站拼 /v1/messages
upstreams:
  - name: opencode-go
    type: openai
    base_url: https://REPLACE_ME/v1
    api_key: ${OPENCODE_GO_KEY}
    priority: 1            # 越小越优先
    models: ["*"]          # "*" 或留空 = 该上游可出所有模型;可用前缀通配 claude-*
    cooldown_sec: 30       # 熔断冷却(连续失败后)
    max_failures: 3
    # 可选:订阅配额监控。网关按 cache_ttl_sec 周期拉取
    #   GET {base}/v1/usage (Bearer api_key)
    # 当 used_pct ≥ hard_used_pct 或 status 非 ok 时,该上游从"首选"降为"备选"。
    #   window: rolling|weekly|monthly,挑你订阅页面里最在意的一个窗口
    #   warn_used_pct 只用于日志/未来告警,不改变选路
    quota:
      enabled: true
      window: monthly
      warn_used_pct: 80
      hard_used_pct: 95
      cache_ttl_sec: 60

  - name: anthropic-official
    type: anthropic
    base_url: https://api.anthropic.com
    api_key: ${ANTHROPIC_API_KEY}
    priority: 2
    models: ["claude-*"]   # 只声明你账号能用的模型范围
    cooldown_sec: 10
    max_failures: 3
    # 官方 api.anthropic.com 不提供 /v1/usage,无法开 quota;只有当你的上游
    # 自己暴露用量接口(如 opencode/zen 这类中转)时才配 quota 块。

# 成本单价表(USD / 每百万 token),按声明顺序匹配,命中第一条即停,支持 "*" 与前缀通配。
# 规则匹配到就按 (prompt*pm + completion*cm + cache_read*crm) / 1e6 折算每次请求的成本入库。
# 单价不对会把"用量"记账算错,但对查询本身无影响;没有匹配规则的模型 cost 记 0。
# 下列数值仅示意,请按各模型在官方的真实单价填写。
pricing:
  - model: claude-opus-*
    prompt_per_m: 15
    completion_per_m: 75
    cache_read_per_m: 1.5
  - model: claude-sonnet-*
    prompt_per_m: 3
    completion_per_m: 15
    cache_read_per_m: 0.3
  - model: claude-haiku-*
    prompt_per_m: 1
    completion_per_m: 5
    cache_read_per_m: 0.1
  - model: "*"            # 兜底:未收录模型记 0(可留空或删除本行)
    prompt_per_m: 0
    completion_per_m: 0
    cache_read_per_m: 0
